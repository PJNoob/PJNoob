<svg xmlns="http://www.w3.org/2000/svg" width="260" height="220" viewBox="0 0 260 220" role="img" aria-labelledby="t">
  <title id="t">Curious Explorer: a planet with orbiting moons, twinkling stars and a question mark</title>
  <style>
    .twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: .4s; } .d2 { animation-delay: .9s; } .d3 { animation-delay: 1.4s; } .d4 { animation-delay: 1.9s; }
    @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }
    .orbit1 { animation: spin 9s linear infinite; transform-origin: 130px 115px; }
    .orbit2 { animation: spin 14s linear infinite reverse; transform-origin: 130px 115px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .float { animation: float 3.2s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .q { animation: pop 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { 0%,100% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(8deg) scale(1.12); } }
  </style>
  <defs>
    <radialGradient id="planet" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFD700"/>
      <stop offset=".55" stop-color="#FF6B9D"/>
      <stop offset="1" stop-color="#7a2bd6"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#FF6B9D"/>
    </linearGradient>
  </defs>

  <!-- stars -->
  <g fill="#FFD700">
    <path class="twinkle" d="M28 30l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path class="twinkle d2" d="M226 40l2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5z" fill="#00D4FF"/>
    <path class="twinkle d3" d="M40 180l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z" fill="#FF6B9D"/>
    <path class="twinkle d4" d="M232 172l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <circle class="twinkle d1" cx="70" cy="22" r="2"/>
    <circle class="twinkle d3" cx="196" cy="16" r="2.2" fill="#00D4FF"/>
    <circle class="twinkle d2" cx="16" cy="110" r="1.8" fill="#FF6B9D"/>
    <circle class="twinkle d4" cx="248" cy="110" r="2"/>
    <circle class="twinkle d1" cx="190" cy="204" r="1.8" fill="#00D4FF"/>
  </g>

  <!-- orbit paths -->
  <ellipse cx="130" cy="115" rx="92" ry="92" fill="none" stroke="#00D4FF" stroke-opacity=".25" stroke-dasharray="3 6"/>
  <ellipse cx="130" cy="115" rx="70" ry="70" fill="none" stroke="#FF6B9D" stroke-opacity=".25" stroke-dasharray="3 6"/>

  <!-- planet -->
  <g class="float">
    <ellipse cx="130" cy="115" rx="66" ry="14" fill="none" stroke="url(#ring)" stroke-width="5" stroke-opacity=".55" transform="rotate(-18 130 115)"/>
    <circle cx="130" cy="115" r="38" fill="url(#planet)"/>
    <circle cx="118" cy="104" r="6" fill="#fff" fill-opacity=".25"/>
    <circle cx="144" cy="128" r="4" fill="#000" fill-opacity=".15"/>
    <path d="M64 115a66 14 0 0 0 132 0" fill="none" stroke="url(#ring)" stroke-width="5" transform="rotate(-18 130 115)"/>
    <!-- question mark -->
    <g class="q">
      <text x="130" y="128" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="38" font-weight="bold" fill="#fff" stroke="#1a1a2e" stroke-width="1.5" paint-order="stroke">?</text>
    </g>
  </g>

  <!-- moons -->
  <g class="orbit1"><circle cx="130" cy="45" r="7" fill="#00D4FF"/></g>
  <g class="orbit2"><circle cx="222" cy="115" r="5" fill="#FFD700"/><circle cx="38" cy="115" r="4" fill="#FF6B9D"/></g>
</svg>
