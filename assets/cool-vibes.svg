<svg xmlns="http://www.w3.org/2000/svg" width="180" height="120" viewBox="0 0 180 120" role="img" aria-labelledby="t">
  <title id="t">Cool vibes: a rocket cruising past twinkling stars</title>
  <style>
    .twinkle { animation: twinkle 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: .5s; } .d2 { animation-delay: 1s; } .d3 { animation-delay: 1.5s; }
    @keyframes twinkle { 0%,100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.2); } }
    .rocket { animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translate(0,0); } 50% { transform: translate(4px,-5px); } }
    .flame { animation: flicker .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: right center; }
    @keyframes flicker { from { transform: scaleX(.75); opacity: .8; } to { transform: scaleX(1.15); opacity: 1; } }
    .streak { animation: streak 1.6s linear infinite; }
    .s2 { animation-delay: .55s; } .s3 { animation-delay: 1.1s; }
    @keyframes streak { from { transform: translateX(60px); opacity: 0; } 20% { opacity: .9; } to { transform: translateX(-120px); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6e8"/>
    </linearGradient>
    <linearGradient id="fire" x1="1" x2="0">
      <stop offset="0" stop-color="#FFD700"/>
      <stop offset=".6" stop-color="#FF6B9D"/>
      <stop offset="1" stop-color="#FF6B9D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- speed streaks -->
  <g stroke-linecap="round" stroke-width="2.5">
    <line class="streak" x1="110" y1="30" x2="135" y2="30" stroke="#00D4FF"/>
    <line class="streak s2" x1="120" y1="92" x2="150" y2="92" stroke="#FF6B9D"/>
    <line class="streak s3" x1="115" y1="64" x2="135" y2="64" stroke="#FFD700"/>
  </g>

  <!-- stars -->
  <path class="twinkle" fill="#FFD700" d="M24 18l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
  <path class="twinkle d2" fill="#00D4FF" d="M160 14l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z"/>
  <path class="twinkle d1" fill="#FF6B9D" d="M156 98l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
  <path class="twinkle d3" fill="#FFD700" d="M20 96l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z"/>
  <circle class="twinkle d2" cx="62" cy="12" r="1.8" fill="#FFD700"/>
  <circle class="twinkle d3" cx="120" cy="110" r="1.8" fill="#00D4FF"/>

  <!-- rocket (pointing right) -->
  <g class="rocket">
    <path class="flame" d="M58 60 L30 52 Q20 60 30 68 Z" fill="url(#fire)"/>
    <!-- fins -->
    <path d="M70 48 L58 34 L80 46 Z" fill="#FF6B9D"/>
    <path d="M70 72 L58 86 L80 74 Z" fill="#FF6B9D"/>
    <!-- body -->
    <path d="M58 50 H110 Q132 54 140 60 Q132 66 110 70 H58 Q54 60 58 50 Z" fill="url(#body)" stroke="#1a1a2e" stroke-opacity=".45"/>
    <!-- nose -->
    <path d="M118 52 Q132 55 140 60 Q132 65 118 68 Q122 60 118 52 Z" fill="#00D4FF"/>
    <!-- window -->
    <circle cx="96" cy="60" r="7" fill="#00D4FF" stroke="#FFD700" stroke-width="2.5"/>
    <circle cx="94" cy="58" r="2" fill="#fff" fill-opacity=".8"/>
    <rect x="62" y="56" width="10" height="8" rx="2" fill="#FFD700"/>
  </g>
</svg>
